name: Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to use for the downloaded APK
        required: true
        default: opict-android-v1.0.1
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.OPICT_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.OPICT_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.OPICT_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?OPICT_ANDROID_KEYSTORE_BASE64 secret is not set}"
          : "${STORE_PASSWORD:?OPICT_ANDROID_STORE_PASSWORD secret is not set}"
          : "${KEY_PASSWORD:?OPICT_ANDROID_KEY_PASSWORD secret is not set}"
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/opict-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=keystore/opict-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=opict
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android/keystore/opict-release.jks android/keystore.properties

      - name: Test and build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew test lint assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: opict-android-${{ inputs.tag }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
