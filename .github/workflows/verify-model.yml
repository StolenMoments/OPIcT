name: Verify production Gemini model

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?SSH_HOST secret is not set}"
          : "${SSH_PRIVATE_KEY:?SSH_PRIVATE_KEY secret is not set}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Verify server model, Antigravity request, health, and storage
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export PATH="/home/opc/.local/bin:/usr/local/bin:/usr/bin:/bin"
          cd /home/opc/opict/server

          model="$(node --input-type=module - <<'NODE'
          import { CLIS } from './src/ai/clis.js';
          if (CLIS.agy.model !== 'gemini-3.8-flash-low') {
            throw new Error(`Unexpected Antigravity model: ${CLIS.agy.model}`);
          }
          console.log(CLIS.agy.model);
          NODE
          )"

          agy models | grep -F -- "$model"
          response="$(agy -p 'Reply with exactly OK.' --model "$model" --effort low --print-timeout 90s)"
          test -n "$response"
          printf 'Antigravity smoke response: %s\n' "$response"
          curl -fsS --max-time 5 http://127.0.0.1:3001/api/health
          printf '\nPackage cache sizes:\n'
          for cache in /root/.npm/_cacache /home/opc/.npm/_cacache /var/cache/dnf; do
            sudo -n du -sh "$cache" 2>/dev/null || true
          done
          df -h /home/opc/opict
          df -i /home/opc/opict
          REMOTE
